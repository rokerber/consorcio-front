kind: pipeline
type: docker
name: consorcio-front-pipeline

trigger:
  branch: [main]
  event: [push]

steps:
  - name: install-and-test
    image: node:20-alpine
    commands:
      - yarn install --frozen-lockfile

  - name: build-and-publish
    image: plugins/docker
    settings:
      dockerfile: Dockerfile
      registry: docker.io
      repo: k3rb3rdock/consorcio-front
      tags:
        - ${DRONE_COMMIT_SHA:0:8} # Usar um tag único é melhor que 'latest'
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: deploy-to-k8s
    image: appleboy/drone-kubectl # Esta imagem pode dar problemas de pull, como você viu.
    settings:
      kube_config:
        from_secret: KUBE_CONFIG
      commands:
        # O 'set image' é a forma correta de atualizar um deployment existente.
        - kubectl set image deployment/consorcio-front-deployment consorcio-front-container=k3rb3rdock/consorcio-front:${DRONE_COMMIT_SHA:0:8} -n dev
